<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Compra Games</title>
    </head>
    <body>
        <header>
            <h1>O Maior Catalogo de Jogos da Web</h1>
            <nav>
                <a href="#servicos">Serviços</a>
                <a href="comprar">Comprar</a>
                <a href="contato">Contato</a>
                <a href="#sobre">Sobre</a>
            </nav> 
        </header>
        <hr>
        <main>
            <section id="servicos">
                <article>
                    <h1>Compre Seus Jogos e Jogue Quando Quiser</h1>
                    <p>Mais liberbade sem ficar refem de assinaturas</p>
                    <img src="imagens/loja-games.jpg" alt="A imagem mostra desejas de jogos midia fisica" width="280">
                </article>
                <article>
                    <h2>Categorias</h2>
                    <ul>
                        <li><b>Ação</b></li>
                        <li><b>Aventura</b></li>
                        <li><b>RPG</b></li>
                        <li><b>Tiro</b></li>
                        <li><b>Esportes e Corrida</b></li>
                        <li><b>Simulação</b></li>
                    </ul>
                </article>
            </section>
            <hr>
            <section id="comprar">
                <form action="#" method="POST">
                    <fieldset>
                        <legend><b> Comprar Jogos</b></legend>

                        <label for="Campo-jogo">Selecione a Categotia:</label>
                        <select name="selecao_jogo" id="campo-jogo" required>
                            <option value="">Selecione uma opção</option>
                            <option value="Acao">Ação</option>
                            <option value="Aventura">Aventura</option>
                            <option value="RPG">RPG</option>
                            <option value="Tiro">Tiro</option>
                            <option value="Esportes">Esportes e Corrida</option>
                            <option value="Simulação">Simulação</option>
                        </select>

                        <p><b>Jogos</b></p>
                        <input type="checkbox" name="jogos[]"
                        id="jogo-futebol" value="futebol">
                        <label for="jogo-futebol">Futebol</label>

                        <input type="checkbox" name="jogos[]"
                        id="jogo-gta" value="gta">
                        <label for="jogo-gta">GTA VI</label>

                        <input type="checkbox" name="jogos[]"
                        id="jogo-elden" value="elden">
                        <label for="jogo-elden">Elden Ring</label>

                        <input type="checkbox" name="jogos[]"
                        id="jogo-minecraft" value="minecraft">
                        <label for="jogo-minecraft">Minecraft</label>

                        <input type="checkbox" name="jogos[]"
                        id="jogo-zelda" value="zelda">
                        <label for="jogo-zelda">Zelda</label>
                        <br>
                    </fieldset>
                </form>
            </section>
        </main> 
    </body>
</html>
